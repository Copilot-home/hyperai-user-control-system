services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:4173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - hyperai-network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    init: true
    restart: unless-stopped
    environment:
      PORT: "5000"
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - hyperai-network

networks:
  hyperai-network:
    driver: bridge
