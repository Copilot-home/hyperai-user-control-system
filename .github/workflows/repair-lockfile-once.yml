name: One-shot package lock repair

on:
  push:
    branches:
      - audit/2026-09-21-runtime-proxy-repair
    paths:
      - .github/workflows/repair-lockfile-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .
          git fetch --no-tags origin "${{ github.ref }}"
          git checkout --detach FETCH_HEAD

      - name: Regenerate lockfile from manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply compatible runtime audit fixes
        run: npm audit fix --package-lock-only --omit=dev --no-fund || true

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): regenerate and remediate package lock"
          git push origin HEAD:audit/2026-09-21-runtime-proxy-repair
