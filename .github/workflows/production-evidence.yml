name: Production Evidence Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .
          git fetch --no-tags origin "${{ github.ref }}"
          git checkout --detach FETCH_HEAD

      - name: Set up Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run production evidence gate
        run: npm run ci:production-evidence-gate

      - name: Upload production evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-evidence-gate
          path: artifacts/production-evidence-gate.json
          if-no-files-found: error
