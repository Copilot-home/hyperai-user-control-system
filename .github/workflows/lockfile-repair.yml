name: Lockfile repair

on:
  push:
    branches:
      - audit/2026-09-21-runtime-proxy-repair
    paths:
      - .github/workflows/lockfile-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repair lockfile
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .
          git fetch --no-tags origin "${{ github.ref }}"
          git checkout --detach FETCH_HEAD
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --omit=dev --no-fund || true
          if git diff --quiet -- package-lock.json; then
            echo "LOCKFILE_ALREADY_SYNCHRONIZED"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): synchronize package lock"
          git push origin HEAD:audit/2026-09-21-runtime-proxy-repair
