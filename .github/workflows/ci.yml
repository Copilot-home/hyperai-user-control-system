name: HyperAI CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Report environment
        run: |
          echo "Repository ${{ github.repository }}"
          echo "Branch ${{ github.ref_name }}"
          node --version
          python --version
