name: HyperAI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hyperai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-surface-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .
          git checkout "${{ github.ref_name }}"

      - name: Validate Docker surface
        run: node scripts/ci/validate-docker-surface.mjs

  build-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .
          git checkout "${{ github.ref_name }}"

      - name: Set up Node.js and Python
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo bash -
          sudo apt-get install -y nodejs python3 python3-pip
          node --version
          npm --version
          python3 --version

      - name: Configure product git identity
        run: |
          python3 scripts/ci/configure_git_identity.py \
            --scope product \
            --git-name "NguyenCuong1989" \
            --product-email "nguyencuong.2509@icloud.com" \
            --ecosystem-email "nguyencuong.2509@icloud.com" | tee identity.json

      - name: Install dependencies
        run: npm ci

      - name: Build production artifact
        run: npm run ci:build

  browser-agent-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-artifact
    steps:
      - name: Checkout
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .
          git checkout "${{ github.ref_name }}"

      - name: Set up Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build production artifact
        run: npm run ci:build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Start backend and preview
        run: |
          node backend/server.js > backend.log 2>&1 &
          npm run preview:ci > preview.log 2>&1 &
          sleep 5

      - name: Run browser agent smoke
        env:
          BACKEND_URL: http://127.0.0.1:5000
          FRONTEND_URL: http://127.0.0.1:4173
          SMOKE_TIMEOUT_MS: "60000"
        run: npm run ci:browser-smoke

      - name: Stop background services
        if: always()
        run: |
          pkill -f "node backend/server.js" || true
          pkill -f "vite preview" || true

  autonomous-boundary-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-artifact
    continue-on-error: true
    steps:
      - name: Checkout
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .
          git checkout "${{ github.ref_name }}"

      - name: Set up Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build production artifact
        run: npm run ci:build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run autonomous boundary proof
        env:
          SMOKE_TIMEOUT_MS: "90000"
          AUTONOMY_RECOVERY_WAIT_MS: "22000"
        run: npm run ci:autonomous-boundary-proof

  legacy-test-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .
          git checkout "${{ github.ref_name }}"

      - name: Set up Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run legacy Jest audit
        run: npm test -- --runInBand
