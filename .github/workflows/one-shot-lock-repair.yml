name: One-shot lockfile repair
on:
  push:
    branches:
      - audit/2026-09-21-runtime-proxy-repair
permissions:
  contents: write
jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, 'regenerate npm lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerate lockfile from manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "LOCKFILE_ALREADY_IN_SYNC"
            exit 0
          fi
          git config user.name "hyperai-lock-repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(ci): regenerate npm lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
